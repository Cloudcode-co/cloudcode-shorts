name: Make video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Đề tài (để trống để Gemini tự chọn)"
        required: false
        default: ""
      source:
        description: "Link trang web để làm video về nó (nhiều link cách nhau bằng dấu cách)"
        required: false
        default: ""
      voice:
        description: "Giọng ElevenLabs: tên, voice id hoặc link (để trống: Ninh Đôn)"
        required: false
        default: ""
      style:
        description: "Phong cách: id/tên trong pipeline/art-directions.json hoặc mô tả tự do (để trống: bốc ngẫu nhiên)"
        required: false
        default: ""
      format:
        description: "Kiểu: để trống (giải thích), brief (điểm tin sáng), quiz, news, tutorial, top5, story, meme hoặc chat"
        required: false
        default: ""
      notes:
        description: "Yêu cầu thêm cho kịch bản và hình (nền, màu, nhịp...)"
        required: false
        default: ""
      builder:
        description: "Ai dựng: để trống (Claude, dự phòng be-ag), claude hoặc beag (Gemini)"
        required: false
        default: ""
      revise:
        description: "Sửa video đã có: slug của video (dùng giọng và yêu cầu ở trên)"
        required: false
        default: ""
  # Sent by the chat bot worker (worker/), from Discord or Telegram.
  repository_dispatch:
    types: [make-video]
  # The daily videos come from the bot worker's crons (worker/wrangler.toml) as
  # repository_dispatch with client_payload.scheduled, since GitHub's own
  # schedule runs late or not at all.

# One video at a time, so history.json and the commits never race.
concurrency:
  group: make-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the push token out of .git so the build step can't use it.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code and Remotion's browser
        run: |
          npm install -g @anthropic-ai/claude-code
          npx remotion browser ensure

      - name: Make the video
        id: make
        env:
          TOPIC: ${{ inputs.topic || github.event.client_payload.topic }}
          SOURCE: ${{ inputs.source || github.event.client_payload.source }}
          VOICE: ${{ inputs.voice || github.event.client_payload.voice }}
          NOTES: ${{ inputs.notes || github.event.client_payload.notes }}
          STYLE: ${{ inputs.style || github.event.client_payload.style }}
          FORMAT: ${{ inputs.format || github.event.client_payload.format }}
          # "early", "morning" or "afternoon" for the daily videos (pipeline/schedule.json).
          SCHEDULED: ${{ github.event.client_payload.scheduled }}
          REVISE: ${{ inputs.revise || github.event.client_payload.revise }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Backup gateway when be-ag fails (pipeline/lib.mjs).
          MPROXY_API_KEY: ${{ secrets.MPROXY_API_KEY }}
          MPROXY_MODEL: ${{ vars.MPROXY_MODEL }}
          # Builder fallback through be-ag; BUILDER=beag skips Claude.
          BUILDER: ${{ inputs.builder || github.event.client_payload.builder || vars.BUILDER }}
          BUILDER_CHOSEN: ${{ inputs.builder || github.event.client_payload.builder }}
          BUILDER_BEAG_MODEL: ${{ vars.BUILDER_BEAG_MODEL }}
          # Stock footage (pipeline/footage.mjs); empty turns it off.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Animated meme stickers (pipeline/memes.mjs); empty turns them off.
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_BUDGET_USD: ${{ vars.CLAUDE_BUDGET_USD }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # The channel /video was run in, else the default channel.
          DISCORD_CHANNEL_ID: ${{ github.event.client_payload.channel_id || vars.DISCORD_CHANNEL_ID }}
          # Pinged when a video is in the TikTok drafts, to paste its caption.
          DISCORD_NOTIFY_USER_ID: ${{ vars.DISCORD_NOTIFY_USER_ID }}
          DISCORD_UPLOAD_MB: ${{ vars.DISCORD_UPLOAD_MB }}
          # The bot worker's URL; finished videos are uploaded to R2 through it.
          CDN_URL: ${{ vars.CDN_URL }}
          CDN_UPLOAD_SECRET: ${{ secrets.CDN_UPLOAD_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node pipeline/run.mjs

      - name: Keep the video's source in the repo
        if: always() && steps.make.outputs.slug != ''
        env:
          SLUG: ${{ steps.make.outputs.slug }}
          TOKEN: ${{ github.token }}
        run: bash scripts/save-video.sh

      # The video and QA stills, only when the video did not reach the CDN.
      # Kept 3 days: the private repo has 500 MB of artifact storage.
      - uses: actions/upload-artifact@v4
        if: always() && steps.make.outputs.slug != '' && steps.make.outputs.cdn == ''
        with:
          name: ${{ steps.make.outputs.slug }}
          path: |
            out/*.mp4
            out/qa/**/*.png
          retention-days: 3
          if-no-files-found: ignore
